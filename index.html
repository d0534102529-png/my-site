        /* Custom Interactive Cursor */
        #custom-cursor {
            position: fixed;
            top: 0; left: 0;
            width: 24px; height: 24px;
            border: 2px solid #0ea5e9;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: width 0.2s, height 0.2s, background-color 0.2s;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
        }
        #custom-cursor.active {
            width: 40px; height: 40px;
            background-color: rgba(14, 165, 233, 0.2);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

                    const existing = prev.find(i => i.product.id === product.id && i.size === size);
                    if (existing) {
                        if (existing.qty >= product.stock) {
                            showToast('הגעת למגבלת המלאי', 'warning');
                            return prev;
                        }
                        return prev.map(i => i === existing ? { ...i, qty: i.qty + 1 } : i);
                    }
                    return [...prev, { product, size, qty: 1 }];
                });
                showToast(`נוסף: ${product.name}`);
            };

            const updateCartQty = (index, delta) => {
                setCart(prev => {
                    const updated = [...prev];
                    const item = updated[index];
                    const newQty = item.qty + delta;
                    if (newQty <= 0) updated.splice(index, 1);
                    else if (newQty > item.product.stock) showToast('אין מספיק מלאי', 'warning');
                    else item.qty = newQty;
                    return updated;
                });
            };

            const handleCheckout = () => {
                if (cart.length === 0) return;
                const needsApproval = cart.some(item => item.product.requiresAdminApproval);
                const freeLocker = lockers.find(l => l.status === 'free');
                if (!needsApproval && !freeLocker) return showToast('אין לוקרים פנויים', 'error');

                const orderId = `#ORD-${Math.floor(1000 + Math.random() * 9000)}`;
                const pin = Math.floor(100000 + Math.random() * 900000).toString();
                const totalQty = cart.reduce((s, i) => s + i.qty, 0);

                const newOrder = {
                    id: orderId,
                    branchId: currentUser.data.id,
                    branchName: currentUser.data.name,
                    customerName: currentUser.data.contactName,
                    lockerId: needsApproval ? null : freeLocker.id,
                    pin: needsApproval ? null : pin,
                    status: needsApproval ? 'pending_approval' : 'received',
                    createdAt: new Date().toLocaleString('he-IL'),
                    items: cart
                };

                if (!needsApproval) setProducts(prev => prev.map(p => {
                    const inCart = cart.filter(c => c.product.id === p.id).reduce((s,c)=>s+c.qty,0);
                    return inCart ? { ...p, stock: Math.max(0, p.stock - inCart) } : p;
                }));

                if (!needsApproval) setLockers(prev => prev.map(l => l.id === freeLocker.id ? {
                    ...l, status: 'preparing', orderId, branchName: currentUser.data.name, customerName: newOrder.customerName, pin, itemsCount: totalQty
                } : l));

                setOrders(prev => [newOrder, ...prev]);
                setCart([]);
                setIsCartOpen(false);
                if (!needsApproval) setSelectedOrder(newOrder);
                showToast(needsApproval ? 'הבקשה נשלחה לאישור מנהל לפני הכנה' : 'הזמנה התקבלה במערכת!');
            };

            const decideApproval = (order, approved) => {
                if (!approved) {
                    setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: 'rejected' } : o));
                    return showToast('הבקשה נדחתה', 'info');
                }
                const freeLocker = lockers.find(l => l.status === 'free');
                if (!freeLocker) return showToast('אין לוקר פנוי לאישור הבקשה', 'error');
                const pin = Math.floor(100000 + Math.random() * 900000).toString();
                setProducts(prev => prev.map(p => {
                    const qty = order.items.filter(i => i.product.id === p.id).reduce((sum, i) => sum + i.qty, 0);
                    return qty ? { ...p, stock: Math.max(0, p.stock - qty) } : p;
                }));
                const approvedOrder = { ...order, lockerId: freeLocker.id, pin, status: 'received', approvedAt: new Date().toLocaleString('he-IL') };
                setLockers(prev => prev.map(l => l.id === freeLocker.id ? { ...l, status: 'preparing', orderId: order.id, branchName: order.branchName, customerName: order.customerName, pin, itemsCount: order.items.reduce((s, i) => s + i.qty, 0) } : l));
                setOrders(prev => prev.map(o => o.id === order.id ? approvedOrder : o));
                showToast('הבקשה אושרה והועברה להכנה');
            };

            // ---- ADMIN ACTIONS ----
            const handleImageUpload = (e, callback) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => callback(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const saveProduct = (e) => {
                e.preventDefault();
                // הבטחת מערך מידות תקין
                const productToSave = {...editingProduct};
                if(typeof productToSave.sizes === 'string') {
                    productToSave.sizes = productToSave.sizes.split(',').map(s=>s.trim()).filter(Boolean);
                }

                if(productToSave.id) {
                    setProducts(prev => prev.map(p => p.id === productToSave.id ? productToSave : p));
                    showToast('מוצר עודכן ונשמר במערכת');
                } else {
                    setProducts(prev => [{...productToSave, id: 'p'+Date.now()}, ...prev]);
                    showToast('מוצר חדש נוסף ונשמר');
                }
                setEditingProduct(null);
            };

            const deleteProduct = (id) => {
                setProducts(prev => prev.filter(p => p.id !== id));
                showToast('מוצר הוסר');
            };

            const addMusicFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const freeSlot = musicLibrary.findIndex(track => !track.url);
                if (freeSlot < 0) return showToast('כל 50 מקומות המוזיקה מלאים', 'warning');
                const reader = new FileReader();
                reader.onloadend = () => setMusicLibrary(prev => prev.map((track, i) => i === freeSlot ? { ...track, title: file.name.replace(/\.[^/.]+$/, ''), url: reader.result, licensed: true } : track));
                reader.readAsDataURL(file);
            };
            const removeMusic = (id) => {
                setMusicLibrary(prev => prev.map(track => track.id === id ? { ...track, title: `מקום מוזיקה ${track.id.replace('slot-', '')}`, url: null, licensed: false } : track));
                if (audioRef.current) { audioRef.current.pause(); audioRef.current.removeAttribute('src'); }
            };
            const playMusic = () => {
                const playable = musicLibrary.filter(track => track.url && track.licensed);
                if (!playable.length) return showToast('אין עדיין מוזיקה מורשית. מנהל יכול להעלות קובץ מורשה.', 'info');
                const next = playable[musicIndex % playable.length];
                setMusicIndex((musicIndex + 1) % playable.length);
                if (audioRef.current) { audioRef.current.src = next.url; audioRef.current.play().catch(() => showToast('יש לאשר ניגון בדפדפן', 'warning')); }
            };

            const recommendedProducts = useMemo(() => {
                const scores = {};
                orders.forEach(order => order.items?.forEach(item => { scores[item.product.id] = (scores[item.product.id] || 0) + item.qty; }));
                const fallbackNames = ['מזלגות', 'כפות', 'אקונומיקה', 'שקיות זבל', 'נוזל ניקוי כלים', 'סקוצ\'ים'];
                const fallback = products.filter(p => fallbackNames.includes(p.name));
                const historical = products.filter(p => scores[p.id]).sort((a,b) => scores[b.id] - scores[a.id]);
                return [...historical, ...fallback].filter((p, i, arr) => arr.findIndex(x => x.id === p.id) === i).slice(0, 8);
            }, [orders, products]);

            const saveBranch = (e) => {
                e.preventDefault();
                if(editingBranch.id) {
                    setBranches(prev => prev.map(b => b.id === editingBranch.id ? editingBranch : b));
                    showToast('ענף עודכן');
                } else {
                    setBranches(prev => [{...editingBranch, id: 'b'+Date.now(), currentUsage: 0}, ...prev]);
                    showToast('ענף חדש הוקם');
                }
                setEditingBranch(null);
            };

            const toggleBranchStatus = (id) => {
                setBranches(prev => prev.map(b => b.id === id ? {...b, status: b.status==='active'?'suspended':'active'} : b));
            };

            const exportToCSV = () => {
                const itemUsage = {};
                orders.forEach(order => {
                    order.items.forEach(item => {
                        const key = `${order.branchName} - ${item.product.name}`;
                        if(!itemUsage[key]) itemUsage[key] = { branch: order.branchName, product: item.product.name, qty: 0 };
                        itemUsage[key].qty += item.qty;
                    });
                });

                let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
                csvContent += "ענף,מוצר,כמות שנמשכה\n";
                Object.values(itemUsage).forEach(row => {
                    csvContent += `"${row.branch}","${row.product}",${row.qty}\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Logix_Report_${new Date().toLocaleDateString('he-IL')}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('דוח יוצא בהצלחה');
            };

            const filteredProducts = useMemo(() => {
                return products.filter(p => {
                    const matchSearch = p.name.includes(searchQuery) || p.sku.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchCat = categoryFilter === 'הכל' || p.category === categoryFilter;
                    return matchSearch && matchCat;
                });
            }, [products, searchQuery, categoryFilter]);

            // פתיחת וואטסאפ
            const openWhatsapp = () => {
                const url = `https://wa.me/${settings.whatsappNumber.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(settings.whatsappMessage)}`;
                window.open(url, '_blank');

            // ==========================================
            // LOGIN SCREEN (LOGIX)
            // ==========================================
            if (!currentUser) {
                return (

                                        placeholder="PIN"
                                        autoFocus
                                    />
                                </div>
                                <button type="submit" className="w-full bg-gradient-to-r from-brand-500 to-brand-600 text-white font-black py-4 rounded-xl hover:from-brand-400 hover:to-brand-500 transition-all transform active:scale-95 text-lg flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(14,165,233,0.3)] border border-brand-400/50">
                                    <span>כניסה מאובטחת</span>
                                    <i data-lucide="arrow-left" className="w-5 h-5"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // UNIFIED MAIN VIEW (CATALOG + ADMIN TABS)
            // ==========================================
            return (
                <div className="min-h-screen flex flex-col transition-colors duration-300">
                    {/* Top Header */}
                    <header className="glass-panel sticky top-0 z-30 shadow-sm border-b">
                        <div className="max-w-[1400px] mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="w-10 h-10 bg-gradient-to-br from-brand-500 to-purple-600 rounded-xl flex items-center justify-center text-white shadow-md">
                                    <i data-lucide="hexagon" className="w-6 h-6"></i>
                                </div>
                                <div className="hidden sm:block">
                                    <h1 className="font-black text-xl leading-none tracking-tight">{settings.siteName}<span className="text-brand-500">.</span></h1>
                                    <span className="text-[10px] text-slate-500 dark:text-slate-400 font-bold tracking-widest uppercase">
                                        {currentUser.role === 'admin' ? 'Admin Dashboard' : 'Internal Store'}
                                    </span>
                                </div>
                            </div>
                            
                            {activeTab === 'catalog' && (
                                <div className="flex-1 max-w-2xl px-6 hidden md:block">
                                    <div className="relative group">
                                        <input 
                                            type="text" 
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            placeholder="חיפוש מוצרים, כלים, ביגוד..." 
                                            className="w-full bg-slate-100 dark:bg-dark-800 border-2 border-transparent focus:bg-white dark:focus:bg-dark-900 focus:border-brand-500 rounded-xl py-2.5 pl-4 pr-12 text-sm transition-all outline-none font-medium text-slate-700 dark:text-slate-200 shadow-inner group-hover:shadow-md" 
                                        />
                                        <i data-lucide="search" className="w-5 h-5 absolute right-4 top-3 text-slate-400"></i>
                                    </div>
                                </div>
                            )}

                            <div className="flex items-center gap-3 sm:gap-5 ml-auto md:ml-0">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 text-slate-500 hover:text-brand-500 transition-colors">
                                    <i data-lucide={isDarkMode ? "sun" : "moon"} className="w-5 h-5"></i>
                                </button>

                                <button onClick={() => setIsCartOpen(true)} className="relative p-2 bg-brand-50 dark:bg-brand-900/20 text-brand-600 dark:text-brand-400 rounded-xl hover:bg-brand-100 dark:hover:bg-brand-900/40 transition border border-brand-100 dark:border-brand-800">
                                    <i data-lucide="shopping-cart" className="w-6 h-6"></i>
                                    {cart.length > 0 && <span className="absolute -top-2 -right-2 bg-red-500 text-white text-[11px] font-black w-6 h-6 rounded-full flex items-center justify-center border-2 border-white dark:border-dark-900 shadow-sm">{cart.reduce((a,b)=>a+b.qty,0)}</span>}
                                </button>
                                
                                <div className="h-8 w-px bg-slate-200 dark:bg-slate-700 hidden sm:block"></div>
                                
                                <div className="flex items-center gap-3 cursor-pointer group" onClick={handleLogout}>
                                    <div className="hidden sm:block text-left text-xs">
                                        <p className="font-bold text-slate-800 dark:text-white">{currentUser.data.name}</p>

                                    <div className={`w-10 h-10 text-white rounded-xl flex items-center justify-center text-sm font-bold shadow-sm ${currentUser.role==='admin'?'bg-gradient-to-r from-purple-500 to-brand-500':'bg-slate-800 dark:bg-slate-700'}`}>
                                        {currentUser.role === 'admin' ? <i data-lucide="shield" className="w-5 h-5"></i> : currentUser.data.name[0]}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-[1400px] mx-auto w-full p-4 md:p-6 flex gap-8 items-start animate-fade-in-up">
                        {/* Sidebar Filters & Admin Menus */}
                        <aside className="w-64 flex-shrink-0 hidden lg:block sticky top-24 space-y-6">
                            
                            {/* Admin Navigation (Only visible to admins) */}
                            {currentUser.role === 'admin' && (
                                <div className="glass-panel p-5 rounded-2xl shadow-sm border border-brand-200 dark:border-brand-800/50 bg-gradient-to-b from-brand-50/50 to-white dark:from-brand-900/10 dark:to-dark-800">

                                    </h3>
                                    <div className="space-y-1 text-sm font-bold">
                                        {[
                                            { id: 'catalog', icon: 'shopping-bag', label: 'חזרה לקטלוג החנות' },

                            {/* Catalog Categories (Visible mostly when in catalog mode) */}
                            {activeTab === 'catalog' && (

                                            <div

                                                className={`flex items-center gap-3 p-2.5 rounded-xl cursor-pointer transition-all ${categoryFilter === cat ? 'bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-800 border border-transparent'}`}
                                            >

                                                    {categoryFilter === cat && <i data-lucide="check" className="w-3 h-3"></i>}

                            {/* Quota display (Only for regular branches) */}

                                    <h3 className="font-bold text-slate-300 mb-1 text-xs uppercase tracking-wider relative z-10">מכסה חודשית</h3>

                                        <div className="h-full bg-gradient-to-r from-brand-400 to-brand-500 rounded-full shadow-[0_0_10px_rgba(56,189,248,0.5)]" style={{width: `${(currentUser.data.currentUsage/currentUser.data.quota)*100}%`}}></div>
                                    </div>

                        </aside>

                        {/* Main Content Area */}
                        <div className="flex-1 min-w-0">
                            
                            {/* === CATALOG VIEW === */}
                            {activeTab === 'catalog' && (
                                <>
                                    {settings.announcement && (
                                        <div className="bg-gradient-to-r from-brand-500/20 to-purple-500/20 border border-brand-500/30 rounded-2xl p-4 mb-6 flex items-start gap-3">
                                            <i data-lucide="info" className="w-6 h-6 text-brand-500 flex-shrink-0"></i>

                                                <p className="text-sm text-slate-600 dark:text-slate-300 mt-1">{settings.announcement}</p>
                                            </div>

                                    {recommendedProducts.length > 0 && (

                                                <button onClick={() => setCategoryFilter('הכל')} className="text-xs font-bold text-brand-600">לכל המוצרים</button>

                                                    <img src={p.img} alt="" className="w-full h-20 object-cover rounded-lg mb-2" /><span className="block text-xs font-black text-slate-800 dark:text-white">{p.name}</span><span className="text-[10px] text-brand-600">+ הוספה מהירה</span>
                                                </button>)}

                                    <div className="flex justify-between items-end mb-6 border-b border-slate-200 dark:border-slate-800 pb-4">

                    </main>

                    <audio ref={audioRef} onEnded={playMusic} />
                    <div className="fixed bottom-6 left-6 z-40 flex items-center gap-1 bg-white/95 dark:bg-dark-800/95 border border-slate-200 dark:border-slate-700 shadow-xl rounded-2xl p-2">
                        <button onClick={playMusic} className="p-2 text-brand-600" title="ניגון / שיר הבא"><i data-lucide="play" className="w-5 h-5"></i></button>
                        <button onClick={() => audioRef.current?.pause()} className="p-2 text-slate-600 dark:text-slate-300" title="השהיה"><i data-lucide="pause" className="w-5 h-5"></i></button>
                        <button onClick={() => setMusicMuted(!musicMuted)} className="p-2 text-slate-600 dark:text-slate-300" title="השתקה"><i data-lucide={musicMuted ? 'volume-x' : 'volume-2'} className="w-5 h-5"></i></button>
                    </div>
                    {musicPromptOpen && (
                        <div className="fixed inset-0 z-[80] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4"><div className="w-full max-w-sm bg-white dark:bg-dark-800 rounded-3xl p-7 text-center shadow-2xl border border-white/10"><div className="w-14 h-14 bg-brand-100 dark:bg-brand-900/30 rounded-2xl mx-auto mb-4 flex items-center justify-center text-brand-600"><i data-lucide="music-2" className="w-7 h-7"></i></div><h3 className="text-xl font-black text-slate-800 dark:text-white">להדליק מוזיקת אווירה?</h3><p className="text-sm text-slate-500 mt-2 mb-5">המוזיקה זמינה רק אם הועלו קבצים מורשים על ידי מנהל.</p><div className="flex gap-3"><button onClick={() => { setMusicPromptOpen(false); playMusic(); }} className="flex-1 bg-brand-600 text-white font-bold py-3 rounded-xl">כן, נגן</button><button onClick={() => setMusicPromptOpen(false)} className="flex-1 bg-slate-100 dark:bg-dark-900 text-slate-600 dark:text-slate-300 font-bold py-3 rounded-xl">לא עכשיו</button></div></div></div>
                    )}

                    {/* Floating Whatsapp Button */}
                    {settings.enableWhatsapp && settings.whatsappNumber && (
                        <button 
                            onClick={openWhatsapp}
                            className="fixed bottom-6 right-6 z-40 bg-emerald-500 text-white p-4 rounded-full shadow-[0_4px_20px_rgba(16,185,129,0.4)] hover:scale-110 hover:bg-emerald-400 transition-all flex items-center justify-center group"
                            title="צור קשר בוואטסאפ"
                        >
                            <i data-lucide="message-circle" className="w-8 h-8"></i>
                            <span className="absolute right-full mr-4 bg-slate-800 text-white text-xs font-bold py-1.5 px-3 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap">
                                תמיכה בוואטסאפ
                            </span>
                        </button>
                    )}

                    {/* Slide-over Cart (Existing code intact) */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 flex justify-end">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onClick={()=>setIsCartOpen(false)}></div>
                            <div className="w-full max-w-md bg-white dark:bg-dark-900 h-full shadow-2xl relative flex flex-col animate-in slide-in-from-left duration-300 border-r border-slate-200 dark:border-slate-800">
                                <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-dark-800">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-brand-100 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 rounded-xl flex items-center justify-center"><i data-lucide="shopping-cart" className="w-5 h-5"></i></div>
                                        <h2 className="text-xl font-black text-slate-800 dark:text-white">העגלה שלי</h2>
                                    </div>
                                    <button onClick={()=>setIsCartOpen(false)} className="p-2 bg-white dark:bg-dark-900 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-dark-800 rounded-full transition"><i data-lucide="x" className="w-5 h-5 text-slate-600 dark:text-white"></i></button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar">
                                    {cart.length === 0 ? (
                                        <div className="text-center text-slate-400 mt-32 flex flex-col items-center opacity-70">
                                            <i data-lucide="shopping-bag" className="w-20 h-20 mb-4 stroke-1"></i>
                                            <p className="font-bold text-lg">העגלה ריקה כרגע</p>
                                            <p className="text-sm">הוסף פריטים כדי להמשיך</p>
                                        </div>
                                    ) : cart.map((item, i) => (
                                        <div key={i} className="flex gap-4 bg-white dark:bg-dark-800 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm relative group">
                                            <div className="w-20 h-20 bg-slate-50 dark:bg-dark-900 rounded-xl p-2 border border-slate-100 dark:border-slate-800">
                                                <img src={item.product.img} className="w-full h-full object-contain" />
                                            </div>
                                            <div className="flex-1 flex flex-col justify-center">
                                                <h4 className="font-bold text-sm leading-tight mb-1 pr-6 text-slate-800 dark:text-white">{item.product.name}</h4>
                                                <div className="text-xs font-medium text-slate-500 mb-3 flex gap-2 items-center">
                                                    <span className="font-mono bg-slate-100 dark:bg-dark-900 px-1.5 py-0.5 rounded text-[10px]">{item.product.sku}</span>
                                                    {item.size && <span className="text-brand-600 dark:text-brand-400 bg-brand-50 dark:bg-brand-900/30 px-1.5 py-0.5 rounded text-[10px] font-bold">מידה {item.size}</span>}
                                                </div>
                                                <div className="flex justify-between items-center bg-slate-50 dark:bg-dark-900 rounded-lg p-1 border border-slate-100 dark:border-slate-800 w-24">
                                                    <button onClick={()=>updateCartQty(i, -1)} className="w-6 h-6 flex items-center justify-center font-black text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-dark-800 rounded shadow-sm">-</button>
                                                    <span className="text-xs font-black text-slate-800 dark:text-white">{item.qty}</span>
                                                    <button onClick={()=>updateCartQty(i, 1)} className="w-6 h-6 flex items-center justify-center font-black text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-dark-800 rounded shadow-sm">+</button>
                                                </div>
                                            </div>
                                            <button onClick={()=>updateCartQty(i, -item.qty)} className="absolute top-3 left-3 w-7 h-7 rounded-full bg-slate-100 dark:bg-dark-900 text-slate-400 hover:bg-red-100 dark:hover:bg-red-900/30 hover:text-red-500 flex items-center justify-center transition opacity-0 group-hover:opacity-100 border border-transparent hover:border-red-200 dark:hover:border-red-800">
                                                <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                {cart.length > 0 && (
                                    <div className="p-6 bg-white dark:bg-dark-800 border-t border-slate-200 dark:border-slate-700 shadow-[0_-10px_30px_rgba(0,0,0,0.05)]">
                                        <div className="flex justify-between items-center mb-5 text-sm font-bold text-slate-600 dark:text-slate-400">
                                            <span>סה"כ פריטים לניפוק:</span>
                                            <span className="text-xl font-black text-slate-900 dark:text-white">{cart.reduce((a,b)=>a+b.qty,0)} יח'</span>
                                        </div>
                                        <button onClick={handleCheckout} className="w-full bg-gradient-to-r from-slate-900 to-slate-800 dark:from-brand-600 dark:to-brand-500 hover:scale-[0.98] text-white font-black py-4 rounded-xl shadow-xl transition-all text-lg flex items-center justify-center gap-2">
                                            <span>הקצה לוקר לאיסוף עכשיו</span>
                                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Order QR Modal */}
                    {selectedOrder && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onClick={()=>setSelectedOrder(null)}></div>
                            <div className="bg-white dark:bg-dark-800 rounded-[2.5rem] w-full max-w-sm relative z-10 overflow-hidden shadow-2xl animate-in zoom-in duration-300 border border-white/10">
                                <div className="bg-gradient-to-br from-emerald-400 to-emerald-600 p-8 text-center text-white relative overflow-hidden">
                                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-20 mix-blend-overlay"></div>
                                    <div className="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-[0_0_30px_rgba(255,255,255,0.3)] text-emerald-500 transform transition hover:scale-110">
                                        <i data-lucide="check" className="w-10 h-10 font-black"></i>
                                    </div>
                                    <h2 className="text-2xl font-black mb-1 drop-shadow-md">ההזמנה התקבלה!</h2>
                                    <p className="text-emerald-50 font-mono text-sm tracking-wider opacity-90">{selectedOrder.id}</p>
                                </div>
                                <div className="p-8 text-center">
                                    <p className="text-slate-500 dark:text-slate-400 text-sm font-bold mb-2 uppercase tracking-widest">מספר הלוקר שלך</p>
                                    <div className="text-8xl font-black mb-8 tracking-tighter drop-shadow-sm text-slate-800 dark:text-white">#{selectedOrder.lockerId}</div>
                                    
                                    <div className="bg-slate-50 dark:bg-dark-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 mb-6 shadow-inner">
                                        <p className="text-xs text-slate-500 dark:text-slate-400 font-bold mb-4">סרוק לפתיחה בעמדת הלוקרים</p>
                                        <div className="bg-white p-3 rounded-2xl inline-block border border-slate-200 shadow-sm mb-5">
                                            <img src={getQRCodeUrl(selectedOrder.pin)} alt="QR Code" className="w-32 h-32 mx-auto" />
                                        </div>
                                        <p className="text-[10px] uppercase font-bold text-slate-400 tracking-widest mb-1">קוד גיבוי ידני</p>
                                        <p className="font-mono font-black text-4xl text-brand-500 tracking-[0.2em]">{selectedOrder.pin}</p>
                                    </div>
                                    
                                    <button onClick={()=>setSelectedOrder(null)} className="w-full bg-slate-100 dark:bg-dark-900 text-slate-700 dark:text-slate-300 font-black py-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-dark-700 transition-colors shadow-sm">
                                        סגור וחזור לקטלוג
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Admin Edit Modals */}
                    {editingProduct && currentUser.role === 'admin' && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={()=>setEditingProduct(null)}></div>
                            <div className="bg-white dark:bg-dark-800 border border-slate-200 dark:border-white/10 rounded-2xl w-full max-w-2xl relative z-10 shadow-2xl p-6 animate-fade-in-up">
                                <h3 className="text-2xl font-black text-slate-800 dark:text-white mb-6 border-b border-slate-200 dark:border-white/10 pb-4">{editingProduct.id ? 'עריכת פריט' : 'יצירת פריט חדש'}</h3>
                                <form onSubmit={saveProduct} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">שם פריט</label><input required value={editingProduct.name} onChange={e=>setEditingProduct({...editingProduct, name: e.target.value})} className="w-full bg-slate-50 dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-lg p-2.5 text-slate-800 dark:text-white" /></div>
                                        <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">מק"ט (SKU)</label><input required value={editingProduct.sku} onChange={e=>setEditingProduct({...editingProduct, sku: e.target.value})} className="w-full bg-slate-50 dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-lg p-2.5 text-slate-800 dark:text-white" /></div>
                                        <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">קטגוריה</label><input required value={editingProduct.category} onChange={e=>setEditingProduct({...editingProduct, category: e.target.value})} className="w-full bg-slate-50 dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-lg p-2.5 text-slate-800 dark:text-white" /></div>
                                        <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">מיקום במחסן (מדף)</label><input value={editingProduct.shelf} onChange={e=>setEditingProduct({...editingProduct, shelf: e.target.value})} className="w-full bg-slate-50 dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-lg p-2.5 text-slate-800 dark:text-white" /></div>
                                        <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">מלאי נוכחי</label><input type="number" required value={editingProduct.stock} onChange={e=>setEditingProduct({...editingProduct, stock: parseInt(e.target.value)})} className="w-full bg-slate-50 dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-lg p-2.5 text-slate-800 dark:text-white" /></div>
                                        <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">התרעת מלאי נמוך (סף)</label><input type="number" required value={editingProduct.threshold} onChange={e=>setEditingProduct({...editingProduct, threshold: parseInt(e.target.value)})} className="w-full bg-slate-50 dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-lg p-2.5 text-slate-800 dark:text-white" /></div>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-4 items-center bg-slate-50 dark:bg-white/5 p-4 rounded-xl border border-slate-200 dark:border-white/5">
                                        <div className="flex gap-4">
                                            <img src={editingProduct.img} className="w-20 h-20 rounded-lg object-contain bg-white dark:bg-white/10 border border-slate-200 dark:border-white/10" />
                                            <div className="flex-1">
                                                <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-2">העלאת תמונה למערכת</label>
                                                <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, (base64) => setEditingProduct({...editingProduct, img: base64}))} className="w-full text-xs text-slate-500 dark:text-slate-400" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="flex items-center gap-2 text-sm font-bold text-slate-800 dark:text-white mb-2 cursor-pointer">
                                                <input type="checkbox" checked={editingProduct.sizeRequired} onChange={e=>setEditingProduct({...editingProduct, sizeRequired: e.target.checked})} className="rounded text-brand-500 focus:ring-brand-500 bg-white dark:bg-dark-900 border-slate-300 dark:border-white/10" />
                                                דורש בחירת מידה/מספר
                                            </label>
                                            <label className="flex items-center gap-2 text-sm font-bold text-purple-700 dark:text-purple-300 mb-2 cursor-pointer">
                                                <input type="checkbox" checked={!!editingProduct.requiresAdminApproval} onChange={e=>setEditingProduct({...editingProduct, requiresAdminApproval: e.target.checked})} className="rounded text-purple-500 focus:ring-purple-500 bg-white dark:bg-dark-900 border-slate-300 dark:border-white/10" />
                                                דרוש אישור מנהל לפני הכנה
                                            </label>
                                            {editingProduct.sizeRequired && (
                                                <input type="text" placeholder="הזן מידות מופרדות בפסיק (לדוגמה: S, M, L או 40, 41, 42)" value={Array.isArray(editingProduct.sizes) ? editingProduct.sizes.join(', ') : editingProduct.sizes} onChange={e=>setEditingProduct({...editingProduct, sizes: e.target.value})} className="w-full bg-slate-50 dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-lg p-2.5 text-slate-800 dark:text-white text-sm" />
                                            )}
                                        </div>
                                    </div>

                                    <div className="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-white/10">
                                        <button type="button" onClick={()=>setEditingProduct(null)} className="px-5 py-2.5 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition">ביטול</button>
                                        <button type="submit" className="bg-brand-600 hover:bg-brand-500 text-white px-6 py-2.5 rounded-xl font-bold transition">שמור במערכת</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {editingBranch && currentUser.role === 'admin' && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={()=>setEditingBranch(null)}></div>
                            <div className="bg-white dark:bg-dark-800 border border-slate-200 dark:border-white/10 rounded-2xl w-full max-w-md relative z-10 shadow-2xl p-6 animate-fade-in-up">
                                <h3 className="text-2xl font-black text-slate-800 dark:text-white mb-6 border-b border-slate-200 dark:border-white/10 pb-4">{editingBranch.id ? 'עריכת ענף' : 'פתיחת ענף חדש'}</h3>
                                <form onSubmit={saveBranch} className="space-y-4">
                                    <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">שם הענף / מחלקה</label><input required value={editingBranch.name} onChange={e=>setEditingBranch({...editingBranch, name: e.target.value})} className="w-full bg-slate-50 dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-lg p-2.5 text-slate-800 dark:text-white" /></div>
                                    <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">קוד גישה אישי (לכניסה למערכת)</label><input required type="password" value={editingBranch.code} onChange={e=>setEditingBranch({...editingBranch, code: e.target.value})} className="w-full bg-slate-50 dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-lg p-2.5 text-slate-800 dark:text-white font-mono tracking-widest" /></div>
                                    <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">איש קשר ראשי</label><input required value={editingBranch.contactName} onChange={e=>setEditingBranch({...editingBranch, contactName: e.target.value})} className="w-full bg-slate-50 dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-lg p-2.5 text-slate-800 dark:text-white" /></div>
                                    <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">נייד איש קשר</label><input value={editingBranch.phone} onChange={e=>setEditingBranch({...editingBranch, phone: e.target.value})} className="w-full bg-slate-50 dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-lg p-2.5 text-slate-800 dark:text-white text-left" dir="ltr" /></div>
                                    <div><label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">מכסה חודשית (כמות פריטים מותרת)</label><input type="number" required value={editingBranch.quota} onChange={e=>setEditingBranch({...editingBranch, quota: parseInt(e.target.value)})} className="w-full bg-slate-50 dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-lg p-2.5 text-slate-800 dark:text-white" /></div>
                                    
                                    <div className="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-white/10">
                                        <button type="button" onClick={()=>setEditingBranch(null)} className="px-5 py-2.5 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition">ביטול</button>
                                        <button type="submit" className="bg-purple-600 hover:bg-purple-500 text-white px-6 py-2.5 rounded-xl font-bold transition">שמור ענף</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {toast && <div className={`fixed top-6 left-1/2 -translate-x-1/2 z-[70] px-6 py-3 rounded-full shadow-2xl text-sm font-bold text-white flex items-center gap-2 animate-in slide-in-from-top duration-300 ${toast.type === 'error' ? 'bg-red-500' : toast.type==='warning' ? 'bg-amber-500' : toast.type==='info' ? 'bg-slate-800' : 'bg-emerald-500'}`}><i data-lucide={toast.type === 'error' ? 'alert-triangle' : 'check-circle'} className="w-5 h-5"></i>{toast.text}</div>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
